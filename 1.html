<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 10px; }
    
    .top-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    input { 
        flex: 1; min-width: 250px; padding: 20px; font-size: 30px; 
        border: 4px solid #28a745; border-radius: 8px; text-align: center; 
        font-weight: 900; direction: ltr;
    }
    
    .main { display: flex; flex-wrap: wrap; gap: 10px; }
    .card { background: white; padding: 15px; flex: 1; min-width: 300px; border: 2px solid #ddd; border-radius: 10px; }
    
    h2 { font-size: 28px; text-align: center; color: #28a745; margin-bottom: 10px; }
    .row { font-size: 30px; font-weight: 900; padding: 10px; border-bottom: 2px solid #eee; line-height: 1.5; }
    
    .val { color: #d9534f; }
    .cash-val { color: #007bff; }
    .monthly-val { color: #28a745; font-size: 40px; }
    .num { direction: ltr; display: inline-block; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .footer { text-align: center; margin-top: 30px; font-size: 18px; color: #555; font-weight: bold; }
    .news-ticker {
    width: 100%;
    overflow: hidden;
    background: #fff;
    border: 2px solid #d9534f;
    border-radius: 8px;
    padding: 10px 0;
    margin: 15px 0;
    white-space: nowrap;
    box-sizing: border-box;
}
.news-ticker span {
    display: inline-block;
    color: #d9534f;
    font-weight: 900;
    font-size: 20px;
    animation: ticker-scroll 14s linear infinite;
}
@keyframes ticker-scroll {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
    .plan-bar { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
    #planType { flex:1; padding:7px 8px; font-size:18px; font-weight:900; text-align:center; border:2px solid #28a745; border-radius:7px; background:#fff; }
    #rateBtn { width:30px; height:32px; padding:0; border:1px solid #ccc; border-radius:50%; background:#f5f5f5; color:#777; font-size:13px; font-weight:900; cursor:pointer; opacity:.5; }
    .rate { display:none; }
    body.show-rates .rate { display:inline; }

    /* تحسين الهاتف */
    * { box-sizing: border-box; }
    html, body { width:100%; max-width:100%; overflow-x:hidden; }
    body { margin:8px; }
    .top-container { gap:8px; margin-bottom:12px; }
    input { min-width:0; width:100%; padding:14px 10px; font-size:24px; }
    .main { gap:8px; }
    .card { min-width:0; width:100%; padding:10px; }
    h2 { font-size:23px; margin:5px 0 8px; }
    .row { font-size:20px; padding:8px 6px; line-height:1.45; }
    .monthly-val { font-size:28px; }
    .grid { grid-template-columns:1fr; gap:6px; }
    .plan-bar { width:100%; }
    #planType { min-width:0; font-size:17px; padding:8px 5px; }
    #rateBtn { width:30px; min-width:30px; height:30px; }
    .footer { margin-top:15px; font-size:14px; }

    
@media (min-width: 700px) {
        body { margin:10px; }
        .card { min-width:300px; }
        .row { font-size:30px; }
        .monthly-val { font-size:40px; }
        .grid { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
        input { min-width:250px; padding:20px; font-size:30px; }
    }





<style>
/* إصلاح ترتيب الأرقام في الهاتف */
.num, .cash-val, .val, .monthly-val {
    direction: ltr !important;
    unicode-bidi: isolate;
    display: inline-block;
    white-space: nowrap;
    vertical-align: middle;
}
@media (max-width: 699px) {
    .row {
        overflow: hidden;
        word-break: normal;
        overflow-wrap: normal;
    }
    .row .num {
        font-size: 20px !important;
        letter-spacing: 0 !important;
        min-width: max-content;
    }
    .row .monthly-val {
        font-size: 27px !important;
    }
}

/* الهاتف فقط: الأشهر تحت بعضها — لا يؤثر على البيسي */
@media (max-width: 699px) {
    #unemp-box,
    #emp-box {
        display: grid;
        grid-template-columns: 1fr !important;
        gap: 6px;
    }

    #unemp-box .row,
    #emp-box .row {
        grid-column: auto !important;
        width: 100%;
        margin: 0;
    }
}


/* ترتيب البطالة على البيسي: 3 أشهر ثم 5 أشهر في نفس العمود، و4 أشهر في العمود الثاني */
@media (min-width: 700px) {
    #unemp-box {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }
    #unemp-box .row {
        width: 100%;
        margin: 0;
    }
    #unemp-box .row:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
    }
    #unemp-box .row:nth-child(2) {
        grid-column: 2;
        grid-row: 1;
    }
    #unemp-box .row:nth-child(3) {
        grid-column: 1;
        grid-row: 2;
    }
}


<style>
.benefit-icon {
    font-size: 16px;
    text-decoration: none;
    margin-right: 5px;
    opacity: .6;
    cursor: pointer;
    vertical-align: middle;
}
.benefit-icon:hover {
    opacity: 1;
}

<style>
.unemp-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:8px;
}
.unemp-title h2{
    margin:5px 0 8px;
}
.benefit-mini{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
    justify-content:center;
}
#benefitStart{
    width:78px;
    height:28px;
    padding:2px 5px;
    font-size:12px;
    font-weight:900;
    text-align:center;
    direction:ltr;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}
#benefitStart:focus{
    border-color:#198754;
}
#benefitAlert{
    font-size:12px;
    font-weight:900;
    color:#c9302c;
    white-space:nowrap;
}
@media(max-width:699px){
    .unemp-title{
        gap:5px;
    }
    #benefitStart{
        width:72px;
        height:27px;
        font-size:11px;
    }
    #benefitAlert{
        font-size:11px;
    }
}
</style>

</style>

</style>

</style>

<style>
/* العناوين تبقى ظاهرة، والنتائج فقط تظهر بعد إدخال المبلغ */
body:not(.has-amount) #unemp-box,
body:not(.has-amount) #emp-box {
    display: none !important;
}
</style>

<style>
#benefitMini{display:none;}
#benefitMini.show{display:flex;}
</style>
</head>
<body>

<div class="top-container">
    <input type="text" id="a" placeholder="المبلغ" oninput="formatInput(this); calc()">
    <input type="text" id="d" placeholder="الدفعة" oninput="formatInput(this); calc()">
</div>
<div class="main">
    <div class="card" id="r1"><div class="unemp-title">
    <h2>البطالة <button type="button" id="benefitBell" class="benefit-icon" title="إظهار التنبيه">🔔</button></h2>
    <div class="benefit-mini" id="benefitMini">
        <input id="benefitStart" type="text" inputmode="numeric"
               maxlength="7" placeholder="03/2022"
               title="شهر/سنة بداية الاستفادة">
        <span id="benefitAlert">🔔 تنبيه: —</span>
    </div>
</div><div id="unemp-box"></div></div>
    <div class="card" id="r2">
        <h2>موظف/متقاعد</h2>
        <div class="plan-bar">
            <select id="planType" onchange="calc()">
                <option value="normal">تقسيط عادي</option>
                <option value="omra">تقسيط عمرة</option>
            </select>
            <button type="button" id="rateBtn" onclick="toggleRates()" title="إظهار النسب">%</button>
        </div>
        <div class="grid" id="emp-box"></div>
    </div>
</div>
    <div class="news-ticker"><span>تم توقيف منحة البطالة 2022 2023 2024</span></div>
<div class="footer">Made by WaLiD_Tech</div>

<script>
function formatInput(el) {
    let val = el.value.replace(/\s/g, '').replace(/\D/g, '');
    el.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function formatNum(num) {
    return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function toggleRates() {
    document.body.classList.toggle("show-rates");
    const btn = document.getElementById("rateBtn");
    const shown = document.body.classList.contains("show-rates");
    btn.style.opacity = shown ? "1" : ".5";
    btn.title = shown ? "إخفاء النسب" : "إظهار النسب";
}

function calc() {
    const a = parseFloat(document.getElementById('a').value.replace(/\s/g, '')) || 0;
    const d = parseFloat(document.getElementById('d').value.replace(/\s/g, '')) || 0;
    const rem = Math.max(0, a - d);

    const unemp = [
        {n:"3 أشهر <span class=\"rate\">(%30)</span>", m:3, limit:38000, x:1.30},
        {n:"4 أشهر <span class=\"rate\">(40%)</span>", m:4, limit:48000, x:1.40},
        {n:"5 أشهر <span class=\"rate\">(%45.7)</span>", m:5, limit:58000, x:1.457}
    ];

    const normal = [
        {p:"26", m:3, x:1.26},
        {p:"36", m:6, x:1.36},
        {p:"51", m:9, x:1.51},
        {p:"65", m:12, x:1.65},
        {p:"94", m:18, x:1.94}
    ];

    const omra = [
        {p:"26", m:3, x:1.26},
        {p:"33", m:6, x:1.33},
        {p:"45", m:9, x:1.45},
        {p:"53", m:12, x:1.53},
        {p:"71", m:18, x:1.71}
    ];

    let h1 = "";
    let h2 = "";

    unemp.forEach(o => {
        const c = Math.max(0, rem - o.limit);
        const base = Math.min(rem, o.limit) * o.x;
        const unit = 100 * o.m;
        const total = o.m === 5
            ? Math.ceil(base / unit) * unit
            : Math.floor(base / unit) * unit;
        const installment = total / o.m;

        h1 += `<div class="row">${o.n}<br>
            الكاش: <span class="cash-val num">${formatNum(c)}</span><br>
            الإجمالي: <span class="val num">${formatNum(total)}</span><br>
            القسط: <span class="monthly-val num">${formatNum(installment)}</span>
        </div>`;
    });

    const selected = document.getElementById("planType").value === "omra" ? omra : normal;

    selected.forEach(o => {
        const base = rem * o.x;
        const unit = 100 * o.m;
        const total = Math.floor(base / unit) * unit;
        const installment = total / o.m;

        h2 += `<div class="row">
            <span class="rate">(%${o.p}) </span>${o.m === 12 ? "12 أشهر" : o.m + " أشهر"}<br>
            الإجمالي: <span class="val num">${formatNum(total)}</span><br>
            القسط: <span class="monthly-val num">${formatNum(installment)}</span>
        </div>`;
    });

    document.getElementById('unemp-box').innerHTML = h1;
    document.getElementById('emp-box').innerHTML = h2;
}

// Show results immediately on opening; inputs will recalculate automatically.
window.addEventListener("DOMContentLoaded", calc);
</script>

<script>
function updateBenefitAlert(){
    const input = document.getElementById("benefitStart");
    const out = document.getElementById("benefitAlert");
    if(!input || !out) return;

    const v = input.value.trim();
    const match = v.match(/^(\d{1,2})\/(\d{4})$/);

    if(!match){
        out.textContent = "🔔 تنبيه: —";
        out.style.color = "#777";
        return;
    }

    const month = Number(match[1]);
    const year = Number(match[2]);

    if(month < 1 || month > 12){
        out.textContent = "🔔 تنبيه: صيغة غير صحيحة";
        out.style.color = "#c9302c";
        return;
    }

    // Rules used in the current calculator:
    // 2022/2023 -> December 2026
    // 2024 -> 36 months from start
    // 2025+ -> 24 months from start
    let end;
    if(year <= 2023){
        end = new Date(2026, 11, 1);
    }else if(year === 2024){
        end = new Date(year, month - 1 + 36, 1);
    }else{
        end = new Date(year, month - 1 + 24, 1);
    }

    const now = new Date();
    const current = new Date(now.getFullYear(), now.getMonth(), 1);
    let left = (end.getFullYear()-current.getFullYear())*12 +
               (end.getMonth()-current.getMonth());

    if(left < 0) left = 0;

    out.textContent = "🔔 تنبيه: باقي " + left + " أشهر.";
    out.style.color = left <= 6 ? "#c9302c" : "#198754";
}

document.addEventListener("DOMContentLoaded", function(){
    const bell = document.getElementById("benefitBell");
    const mini = document.getElementById("benefitMini");
    if(bell && mini){
        bell.addEventListener("click", function(){
            mini.classList.toggle("show");
        });
    }
    const input = document.getElementById("benefitStart");
    if(input){
        input.addEventListener("input", function(){
            // Keep only digits and one slash, and guide the format MM/YYYY.
            let v = input.value.replace(/[^\d/]/g, "");
            v = v.replace(/\/+/g, "/");
            if(v.length === 2 && !v.includes("/")) v += "/";
            input.value = v.slice(0,7);
            updateBenefitAlert();
        });
    }
    updateBenefitAlert();
});
</script>


<script>
function updateAmountVisibility(){
    const a = document.getElementById("a");
    const value = a ? a.value.replace(/\s/g,"").replace(/\D/g,"") : "";
    document.body.classList.toggle("has-amount", Number(value) > 0);
}

document.addEventListener("DOMContentLoaded", function(){
    const a = document.getElementById("a");
    if(a) {
        a.addEventListener("input", updateAmountVisibility);
    }
    updateAmountVisibility();
});
</script>

</body>
</html>
